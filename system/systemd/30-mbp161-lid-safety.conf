# MacBookPro16,1: let the compositor handle the lid, not logind.
#
# logind's "docked" detection is unreliable on this dual-GPU topology. It
# reports Docked=true with both the internal and external outputs active, yet
# still took the ordinary HandleLidSwitch=suspend path on a recorded close.
# That turns "close the lid while docked" into a full system suspend, which
# is not what you want when an external display is driving the desktop.
#
# With this in place the compositor reconciles the displays itself: it
# disables the internal output on close and modesets it back on open, while
# the external output keeps its CRTC throughout. Explicit suspend (menu,
# systemctl suspend) still works normally.
[Login]
HandleLidSwitch=ignore
